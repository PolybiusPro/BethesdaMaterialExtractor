name: Build release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        shell: pwsh
        run: python -m pip install --upgrade "pyinstaller>=6,<7"

      - name: Build and test
        shell: pwsh
        run: .\build.ps1

      - name: Package release
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD "release-package"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          Copy-Item -LiteralPath "dist\BME.exe" -Destination $packageRoot
          Copy-Item -LiteralPath "dist\LICENSE" -Destination $packageRoot
          Copy-Item -LiteralPath "dist\COPYRIGHT" -Destination $packageRoot

          $archive = Join-Path $PWD "BME-Windows-x64.zip"
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $archive -Force

          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  BME-Windows-x64.zip" |
            Set-Content -LiteralPath "BME-Windows-x64.zip.sha256" -NoNewline

      - name: Set release metadata
        id: release
        shell: pwsh
        run: |
          $versionLine = Select-String -LiteralPath "pyproject.toml" `
            -Pattern '^version\s*=\s*"([^"]+)"\s*$'
          if ($null -eq $versionLine) {
            throw "Could not read the project version from pyproject.toml."
          }

          $version = $versionLine.Matches[0].Groups[1].Value
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "title=BME v$version" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "${{ steps.release.outputs.tag }}" 2>$null) {
            throw "Release ${{ steps.release.outputs.tag }} already exists. Update the version in pyproject.toml before publishing another release."
          }

          gh release create "${{ steps.release.outputs.tag }}" `
            "BME-Windows-x64.zip#BME for Windows x64" `
            "BME-Windows-x64.zip.sha256#SHA-256 checksum" `
            --target "$env:GITHUB_SHA" `
            --title "${{ steps.release.outputs.title }}" `
            --generate-notes

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: BME-Windows-x64.zip
          version: ${{ steps.release.outputs.version }}
          category: main
